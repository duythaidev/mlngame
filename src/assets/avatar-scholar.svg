  <!-- Star Badge on Pocket -->
  <rect x="20" y="54" width="4" height="4" fill="#FBC02D"/>

  <!-- Crisp Pixel Outline -->
  <path d="M18,10 h28 v6 h6 v12 h-4 v16 h14 v16 h-48 v-16 h14 v-16 h-4 v-12 h6 v-6 z" fill="none" stroke="#2C1E18" stroke-width="2"/>

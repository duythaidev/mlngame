  <rect x="16" y="14" width="32" height="12" fill="#212121"/>
  <rect x="24" y="8" width="16" height="4" fill="#424242"/>
  <rect x="14" y="18" width="4" height="10" fill="#212121"/>
  <rect x="46" y="18" width="4" height="10" fill="#212121"/>


  <rect x="37" y="29" width="3" height="3" fill="#212121"/>
  <rect x="24" y="28" width="2" height="2" fill="#FFFFFF"/>
  <rect x="36" y="28" width="2" height="2" fill="#FFFFFF"/>

  <!-- Smile & Nose -->

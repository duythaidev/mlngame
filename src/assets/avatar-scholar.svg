  <rect x="16" y="26" width="4" height="8" fill="#FFCC80"/> <!-- Left ear -->
  <rect x="44" y="26" width="4" height="8" fill="#FFCC80"/> <!-- Right ear -->
  <rect x="22" y="34" width="4" height="3" fill="#FFAB91"/> <!-- Left blush -->
  <rect x="38" y="34" width="4" height="3" fill="#FFAB91"/> <!-- Right blush -->

